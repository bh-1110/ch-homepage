<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CMS | Psychotherapie Wien</title>
  </head>
  <body>
    <script>
      const cmsConfigVersion = 'homepage-folder-collection-v1';
      if (localStorage.getItem('cmsConfigVersion') !== cmsConfigVersion) {
        Object.keys(localStorage)
          .filter((key) => key.startsWith('decap-cms') || key.startsWith('netlify-cms') || key.includes('cms'))
          .forEach((key) => localStorage.removeItem(key));
        sessionStorage.clear();
        localStorage.setItem('cmsConfigVersion', cmsConfigVersion);
      }
    </script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
